<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Location Map App</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; }
        .header-title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px 20px;
            z-index: 1000;
            font-family: Arial, sans-serif;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-title">Live Location Map</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ম্যাপ ইনিশিয়ালাইজ করা (ডিফল্ট সেন্টার বাংলাদেশ)
        var map = L.map('map').setView([23.6850, 90.3563], 7);

        // ওপেনস্ট্রিটম্যাপ টাইল যোগ করা
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let marker, circle;

        // ইউজারের লাইভ লোকেশন ট্র্যাক করা
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(function (position) {
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;
                var accuracy = position.coords.accuracy;

                if (marker) {
                    map.removeLayer(marker);
                    map.removeLayer(circle);
                }

                // লোকেশনে মার্কার ও সার্কেল যোগ করা
                marker = L.marker([lat, lng]).addTo(map).bindPopup("You are here!").openPopup();
                circle = L.circle([lat, lng], { radius: accuracy }).addTo(map);

                // ম্যাপ ইউজারের লোকেশনে সেন্টারে নিয়ে যাওয়া
                map.setView([lat, lng], 16);
            }, function (error) {
                alert("Geolocation error: " + error.message);
            }, {
                enableHighAccuracy: true
            });
        } else {
            alert("Geolocation is not supported by your browser");
        }
    </script>
</body>
</html>
